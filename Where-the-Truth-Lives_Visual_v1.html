<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where the Truth Lives — Teaching Visual</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#E7E5DA;}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px;}
  svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 24px rgba(0,0,0,0.12));border-radius:10px;}
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg" font-family="'Caveat',cursive">

  <!-- PAGE -->
  <rect x="0" y="0" width="680" height="900" fill="#F2F0E5"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="680" height="110" fill="#282726"/>
  <text x="340" y="56" text-anchor="middle" font-family="'Lilita One',sans-serif" font-size="34" fill="#F2F0E5" letter-spacing="0.5">WHERE THE TRUTH LIVES</text>
  <text x="340" y="88" text-anchor="middle" font-style="italic" font-size="18" fill="#9F9D96">The same person should show up in every room — or you just found your answer.</text>

  <!-- ============ STEP 1 — ANSWER KEY (RED) ============ -->
  <rect x="40" y="132" width="600" height="64" rx="8" fill="#D14D41" stroke="#AF3029" stroke-width="3"/>
  <line x1="46" y1="139" x2="634" y2="139" stroke="#FDB2A2" stroke-width="1.5" opacity="0.4"/>
  <circle cx="72" cy="156" r="15" fill="#FFFFFF"/>
  <text x="72" y="161" text-anchor="middle" font-family="'Lilita One',sans-serif" font-size="15" fill="#AF3029">1</text>
  <text x="100" y="155" font-family="'Lilita One',sans-serif" font-size="19" fill="#FFFFFF">THE ANSWER KEY</text>
  <text x="100" y="178" font-size="17" fill="#FDB2A2">Preferred Profile</text>
  <text x="624" y="162" text-anchor="end" font-style="italic" font-size="15" fill="#FFE1D5">Define the win before anyone walks in.</text>

  <!-- arrow -->
  <path d="M340 200 l9 0 -9 11 -9 -11 z" fill="#282726"/>

  <!-- ============ STEP 2 — ANSWER SHEET (BLUE) ============ -->
  <rect x="40" y="212" width="600" height="64" rx="8" fill="#3171B2" stroke="#163B66" stroke-width="3"/>
  <line x1="46" y1="219" x2="634" y2="219" stroke="#ABCFE2" stroke-width="1.5" opacity="0.4"/>
  <circle cx="72" cy="236" r="15" fill="#FFFFFF"/>
  <text x="72" y="241" text-anchor="middle" font-family="'Lilita One',sans-serif" font-size="15" fill="#3171B2">2</text>
  <text x="100" y="235" font-family="'Lilita One',sans-serif" font-size="19" fill="#FFFFFF">THE ANSWER SHEET</text>
  <text x="100" y="258" font-size="17" fill="#ABCFE2">Tell Us About You</text>
  <text x="624" y="242" text-anchor="end" font-style="italic" font-size="15" fill="#E1ECEB">Their story — locked in writing, before they meet you.</text>

  <!-- arrow -->
  <path d="M340 280 l9 0 -9 11 -9 -11 z" fill="#282726"/>

  <!-- ============ STEP 3 — THE FOUR ROOMS (DARK CONTAINER) ============ -->
  <rect x="40" y="292" width="600" height="246" rx="8" fill="#282726"/>
  <circle cx="72" cy="316" r="15" fill="#FFFFFF"/>
  <text x="72" y="321" text-anchor="middle" font-family="'Lilita One',sans-serif" font-size="15" fill="#282726">3</text>
  <text x="100" y="316" font-family="'Lilita One',sans-serif" font-size="19" fill="#F2F0E5">THE FOUR ROOMS</text>
  <text x="100" y="335" font-size="16" fill="#9F9D96">Where the Truth Lives</text>
  <text x="624" y="324" text-anchor="end" font-style="italic" font-size="14" fill="#B7B5AC">Test the claim against reality — same person in every room?</text>

  <!-- ROOM 1 -->
  <rect x="56" y="352" width="272" height="82" rx="6" fill="#F2F0E5" stroke="#AF3029" stroke-width="2"/>
  <circle cx="82" cy="380" r="14" fill="#AF3029"/>
  <text x="82" y="385" text-anchor="middle" font-family="'Lilita One',sans-serif" font-size="12" fill="#FFFFFF">01</text>
  <text x="106" y="377" font-family="'Lilita One',sans-serif" font-size="15" fill="#282726">Their Word</text>
  <text x="106" y="393" font-size="13" fill="#575653">Interview</text>
  <text x="72" y="414" font-size="12" fill="#7A7873">Competency · Capacity · Calling</text>
  <text x="72" y="428" font-size="12" fill="#7A7873">Conviction · Culture</text>

  <!-- ROOM 2 -->
  <rect x="352" y="352" width="272" height="82" rx="6" fill="#F2F0E5" stroke="#3171B2" stroke-width="2"/>
  <circle cx="378" cy="380" r="14" fill="#3171B2"/>
  <text x="378" y="385" text-anchor="middle" font-family="'Lilita One',sans-serif" font-size="12" fill="#FFFFFF">02</text>
  <text x="402" y="377" font-family="'Lilita One',sans-serif" font-size="15" fill="#282726">Their Energy</text>
  <text x="402" y="393" font-size="13" fill="#575653">Informal</text>
  <text x="368" y="421" font-size="12" fill="#7A7873">Chemistry — you watch, you don't ask</text>

  <!-- ROOM 3 -->
  <rect x="56" y="444" width="272" height="82" rx="6" fill="#F2F0E5" stroke="#C2872B" stroke-width="2"/>
  <circle cx="82" cy="472" r="14" fill="#C2872B"/>
  <text x="82" y="477" text-anchor="middle" font-family="'Lilita One',sans-serif" font-size="12" fill="#FFFFFF">03</text>
  <text x="106" y="469" font-family="'Lilita One',sans-serif" font-size="15" fill="#282726">Their Witnesses</text>
  <text x="106" y="485" font-size="13" fill="#575653">References</text>
  <text x="72" y="506" font-size="12" fill="#7A7873">Character · Coachability</text>
  <text x="72" y="520" font-size="12" fill="#7A7873">Consistency</text>

  <!-- ROOM 4 -->
  <rect x="352" y="444" width="272" height="82" rx="6" fill="#F2F0E5" stroke="#4F7A3A" stroke-width="2"/>
  <circle cx="378" cy="472" r="14" fill="#4F7A3A"/>
  <text x="378" y="477" text-anchor="middle" font-family="'Lilita One',sans-serif" font-size="12" fill="#FFFFFF">04</text>
  <text x="402" y="469" font-family="'Lilita One',sans-serif" font-size="15" fill="#282726">Your Gut</text>
  <text x="402" y="485" font-size="13" fill="#575653">Prayer</text>
  <text x="368" y="513" font-size="12" fill="#7A7873">Confidence — peace or pressure</text>

  <!-- arrow -->
  <path d="M340 542 l9 0 -9 11 -9 -11 z" fill="#282726"/>

  <!-- ============ STEP 4 — THE GRADE (GREEN) ============ -->
  <rect x="40" y="554" width="600" height="64" rx="8" fill="#4F7A3A" stroke="#3A5C2A" stroke-width="3"/>
  <line x1="46" y1="561" x2="634" y2="561" stroke="#BFD9AE" stroke-width="1.5" opacity="0.4"/>
  <circle cx="72" cy="578" r="15" fill="#FFFFFF"/>
  <text x="72" y="583" text-anchor="middle" font-family="'Lilita One',sans-serif" font-size="15" fill="#3A5C2A">4</text>
  <text x="100" y="577" font-family="'Lilita One',sans-serif" font-size="19" fill="#FFFFFF">THE GRADE</text>
  <text x="100" y="600" font-size="17" fill="#BFD9AE">The 90+ Rule</text>
  <text x="624" y="584" text-anchor="end" font-style="italic" font-size="15" fill="#E6EFDD">90 out of 100 — and peace. Either one missing is a no.</text>

  <!-- DIVIDER -->
  <line x1="40" y1="652" x2="640" y2="652" stroke="#DAD8CE" stroke-width="1.5"/>

  <!-- PUNCH CLOSE -->
  <text x="340" y="690" text-anchor="middle" font-style="italic" font-size="19" fill="#9F9D96">Truth doesn't live in one room.</text>
  <text x="340" y="738" text-anchor="middle" font-family="'Lilita One',sans-serif" font-size="34" fill="#282726">WHICH ROOM DID YOU SKIP?</text>

  <!-- FOOTER -->
  <text x="340" y="878" text-anchor="middle" font-size="14" fill="#B7B5AC">Ready Set Grow</text>

</svg>
</div>
</body>
</html>
